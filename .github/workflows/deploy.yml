name: Desplegar en el VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

# Two merges in a row deploy one after the other, never at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to a forced command
          # (/usr/local/bin/opencivic-deploy.sh), so no command is sent.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@179.236.66.237

      - name: Comprobar que el sitio responde
        # Containers being recreated (and Remark42 passing its healthcheck)
        # leave Traefik without a backend for a few seconds, so retry.
        run: |
          for url in https://opencivicsolutions.org/ https://opencivicsolutions.org/blog                      https://opencivicsolutions.org/sitemap.xml https://opencivicsolutions.org/comentarios/ping                      https://boletin.opencivicsolutions.org/health; do
            for attempt in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "$url -> $code"
            [ "$code" = 200 ]
          done
