name: Desplegar en el VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

# Two merges in a row deploy one after the other, never at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pruebas de HONEY
        working-directory: honey
        run: |
          pip install -q -r requirements.txt
          python -m unittest discover -v
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to a forced command
          # (/usr/local/bin/opencivic-deploy.sh), so no command is sent.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@179.236.66.237

      - name: Comprobar que el sitio responde
        # Containers being recreated (and Remark42 passing its healthcheck)
        # leave Traefik without a backend for a few seconds, so retry.
        run: |
          for url in https://opencivicsolutions.org/ https://opencivicsolutions.org/blog                      https://opencivicsolutions.org/sitemap.xml https://opencivicsolutions.org/comentarios/ping; do
            for attempt in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "$url -> $code"
            [ "$code" = 200 ]
          done

      - name: Comprobar el boletín
        # Una caída de Listmonk no debe marcar como fallido el despliegue del
        # sitio: queda como aviso visible en el resumen de la ejecución.
        continue-on-error: true
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://boletin.opencivicsolutions.org/health)
            [ "$code" = 200 ] && break
            sleep 5
          done
          echo "boletín -> $code"
          if [ "$code" != 200 ]; then
            echo "::warning title=Boletín sin responder::boletin.opencivicsolutions.org/health respondió $code"
            exit 1
          fi
