services:
  web:
    build: .
    container_name: hrp-dashboard
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.hrp-dashboard.rule=Host(`opencivicsolutions.org`) || Host(`www.opencivicsolutions.org`)
      - traefik.http.routers.hrp-dashboard.entrypoints=websecure
      - traefik.http.routers.hrp-dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.hrp-dashboard.loadbalancer.server.port=80
