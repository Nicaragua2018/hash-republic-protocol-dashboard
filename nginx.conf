server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every real route was pre-rendered to its own index.html (see
    # scripts/prerender.mjs), so there is no SPA catch-all here: a path
    # that doesn't match a file or a directory is a genuine 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # El portero del boletín responde /boletin/suscribir a través de Traefik.
    # Si no está (por ejemplo, mientras se reinicia en un despliegue), Traefik
    # manda la petición aquí: se avisa con un 503 en vez de un 404.
    location = /boletin/suscribir {
        return 503;
    }
    error_page 503 /boletin-no-disponible.html;
    location = /boletin-no-disponible.html {
        internal;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
