server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Behind Traefik this server only sees plain HTTP on port 80; relative
    # Location headers keep redirects on the visitor's https:// address.
    absolute_redirect off;

    # Text compresses to a fraction of its size; nginx leaves gzip off by default.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/xml application/xml application/rss+xml text/plain;

    # Basic browser protections for every response. TLS ends at Traefik,
    # so visitors only ever reach this site over HTTPS. add_header is not
    # inherited by a location that sets its own, hence the include below.
    include /etc/nginx/snippets/security-headers.conf;

    # "/sobre/" → "/sobre": routes are flat files, and a trailing slash
    # would otherwise hit a directory with no index and answer 403.
    rewrite ^/(.+)/$ /$1 permanent;

    # Every real route was pre-rendered to its own .html (see
    # scripts/prerender.mjs), so there is no SPA catch-all here: a path that
    # matches no file is a genuine 404. HTML is revalidated on every visit
    # so a deploy shows up right away.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;

    # El portero del boletín responde /boletin/suscribir a través de Traefik.
    # Si no está (por ejemplo, mientras se reinicia en un despliegue), Traefik
    # manda la petición aquí: se avisa con un 503 en vez de un 404.
    location = /boletin/suscribir {
        return 503;
    }
    error_page 503 /boletin-no-disponible.html;
    location = /boletin-no-disponible.html {
        internal;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite's build output carries a content hash in each file name, so a
    # changed file always gets a new URL and can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Logos, illustrations and fonts in public/ keep their names across
    # deploys: cache them, but let browsers pick up a replaced file in a day.
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?|mp4)$ {
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
